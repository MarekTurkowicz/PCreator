[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Streaming analysis of Serilog CLEF logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "duckdb>=1.0", "pytz>=2024.1", "pandas>=2.2"]

[project.scripts]
loglens = "loglens.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loglens = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
