name: codex-daily

on:
  schedule:
    # 3 sloty, pn–sb (UTC). scripts/daily_plan.py losuje, które 1–3 z nich pracują danego dnia.
    # Zmieniasz godziny → zmień też SLOTS w scripts/daily_plan.py.
    - cron: "17 8 * * 1-6"
    - cron: "43 12 * * 1-6"
    - cron: "29 17 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: read

# Jeden przebieg naraz — auth.json z rotującym refresh tokenem nie znosi równoległości.
concurrency:
  group: codex-daily
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false   # Codex nie dostaje tokenu do gita

      - name: Losowanie — czy ten slot pracuje?
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          END_DATE: ${{ vars.END_DATE }}
          PLAN_SALT: ${{ vars.PLAN_SALT }}
        run: python3 scripts/daily_plan.py

      - if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - if: steps.plan.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Instalacja narzędzi
        if: steps.plan.outputs.run == 'true'
        run: |
          npm install -g @openai/codex
          pip install -q pytest ruff

      # Ubuntu 24+/26 blokuje nieuprzywilejowane user namespaces (AppArmor),
      # przez co sandbox Codexa (bubblewrap) nie startuje. Dotyczy tylko jednorazowego runnera.
      - name: Sandbox Codexa (bubblewrap)
        if: steps.plan.outputs.run == 'true'
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Auth Codexa (subskrypcja ChatGPT)
        if: steps.plan.outputs.run == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME" && chmod 700 "$CODEX_HOME"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          # Oszczędzanie tokenów: krótkie odpowiedzi, bez web search, przycięte wyjścia narzędzi
          cat > "$CODEX_HOME/config.toml" <<'EOF'
          cli_auth_credentials_store = "file"
          model_verbosity = "low"
          web_search = "disabled"
          tool_output_token_limit = 6000
          EOF
          sed -i 's/^ *//' "$CODEX_HOME/config.toml"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"

      - name: Codex — jeden krok + testy
        if: steps.plan.outputs.run == 'true'
        env:
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_EFFORT: ${{ vars.CODEX_EFFORT || 'medium' }}
        run: bash scripts/codex_step.sh

      - name: Commit, PR, CI, merge
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: bash scripts/publish.sh

      # Refresh token rotuje przy każdym odświeżeniu — zapisz nowy auth.json z powrotem do sekretu.
      - name: Zapis odświeżonego auth.json
        if: always() && steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          f="$RUNNER_TEMP/codex-home/auth.json"
          [ -s "$f" ] && gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < "$f"
